# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build, tests, licences, iOS compile of :engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # overgrown-data is private: fetch it at the pinned commit with its read-only deploy key.
      - id: pin
        run: echo "sha=$(git rev-parse HEAD:overgrown-data)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: stcksmsh/overgrown-data
          ref: ${{ steps.pin.outputs.sha }}
          path: overgrown-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build :engine:compileKotlinIosArm64 :engine:compileKotlinIosSimulatorArm64
      - name: Simulation report is current
        run: |
          ./gradlew :engine-sim:simReport
          git diff --exit-code docs/reports/

  reproducible:
    name: Build the release APK twice and compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: first
      # overgrown-data is private: fetch it at the pinned commit with its read-only deploy key.
      - id: pin_first
        working-directory: first
        run: echo "sha=$(git rev-parse HEAD:overgrown-data)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: stcksmsh/overgrown-data
          ref: ${{ steps.pin_first.outputs.sha }}
          path: first/overgrown-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
      - uses: actions/checkout@v7
        with:
          path: second-build-in-another-dir
      # overgrown-data is private: fetch it at the pinned commit with its read-only deploy key.
      - id: pin_second
        working-directory: second-build-in-another-dir
        run: echo "sha=$(git rev-parse HEAD:overgrown-data)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: stcksmsh/overgrown-data
          ref: ${{ steps.pin_second.outputs.sha }}
          path: second-build-in-another-dir/overgrown-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # No Gradle build cache: each build must produce the APK from scratch.
      - name: First build
        working-directory: first
        run: ./gradlew --no-daemon --no-build-cache :app:assembleFossRelease
      - name: Second build
        working-directory: second-build-in-another-dir
        run: ./gradlew --no-daemon --no-build-cache :app:assembleFossRelease
      - name: Compare
        run: >-
          cmp
          first/app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
          second-build-in-another-dir/app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
